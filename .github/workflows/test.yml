name: Tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-22.04  # newest image that still ships Python 3.9
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.10", "3.11", "3.12"]
    services:
      postgres:  # the tests need a real PostgreSQL; each run makes and drops its own schemas
        image: postgres:17.6-alpine
        env:
          POSTGRES_USER: sgt
          POSTGRES_PASSWORD: sgt
          POSTGRES_DB: sgtightener_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U sgt" --health-interval 2s --health-timeout 5s --health-retries 30
    env:
      SG_TIGHTENER_TEST_PG_DSN: postgresql://sgt:sgt@127.0.0.1:5432/sgtightener_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install -r requirements-dev.txt
      - run: python -m py_compile sg_*.py
      - run: python -m pytest
